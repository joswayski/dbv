name: Native Windows frontend

on:
  push:
    branches: [main]
    paths:
      - "experiments/windows-native/**"
      - "crates/dbm-engine/**"
      - "crates/dbm-workbench/**"
      - ".github/workflows/native-windows.yml"
  pull_request:
    paths:
      - "experiments/windows-native/**"
      - "crates/dbm-engine/**"
      - "crates/dbm-workbench/**"
      - ".github/workflows/native-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Win32 frontend
    runs-on: windows-2025
    defaults:
      run:
        working-directory: experiments/windows-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release

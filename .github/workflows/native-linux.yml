name: Native Linux frontend

on:
  push:
    branches: [main]
    paths:
      - "experiments/linux-native/**"
      - "crates/dbm-engine/**"
      - "crates/dbm-workbench/**"
      - ".github/workflows/native-linux.yml"
  pull_request:
    paths:
      - "experiments/linux-native/**"
      - "crates/dbm-engine/**"
      - "crates/dbm-workbench/**"
      - ".github/workflows/native-linux.yml"

permissions:
  contents: read

jobs:
  native:
    name: GTK4 frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/linux-native
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-4-dev \
            libssl-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release

[workspace]
members = ["apps/desktop/src-tauri", "crates/dbm-engine", "crates/dbm-workbench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories = "6"
keyring = "4.1"
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "native-tls-tls"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
redis_rs = { package = "redis", version = "0.32", features = ["tokio-native-tls-comp"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = [
    "array-impls",
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-uuid-1",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
